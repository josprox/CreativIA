<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Drawing Tutorial Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-section.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        #fileInput {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        .preview-section {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .canvas-container {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }

        .canvas-container h3 {
            margin-bottom: 15px;
            color: #333;
        }

        canvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            max-width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        .step-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .step-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .step-btn:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .step-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .step-indicator {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            min-width: 150px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-panel {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info-panel h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .info-panel p {
            color: #666;
            line-height: 1.6;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Drawing Tutorial Generator</h1>
        
        <div class="upload-section" id="uploadSection">
            <p style="margin-bottom: 20px; font-size: 1.1em; color: #666;">
                Upload an image to generate a step-by-step drawing tutorial
            </p>
            <input type="file" id="fileInput" accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                Choose Image
            </button>
            <p style="margin-top: 15px; color: #999; font-size: 0.9em;">
                Or drag and drop an image here
            </p>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing image and generating tutorial...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="previewSection" style="display: none;">
            <div class="preview-section">
                <div class="canvas-container">
                    <h3>Original Image</h3>
                    <canvas id="originalCanvas"></canvas>
                </div>
                <div class="canvas-container">
                    <h3>Drawing Tutorial</h3>
                    <canvas id="tutorialCanvas"></canvas>
                </div>
                <div class="canvas-container">
                    <h3>Final Result</h3>
                    <canvas id="finalCanvas"></canvas>
                </div>
            </div>

            <div class="controls">
                <div class="step-controls">
                    <button class="step-btn" id="prevBtn" onclick="previousStep()">← Previous</button>
                    <div class="step-indicator">
                        Step <span id="currentStep">1</span> <span id="stepLimitIndicator">of <span id="totalSteps">1</span></span>
                    </div>
                    <button class="step-btn" id="nextBtn" onclick="nextStep()">Next →</button>
                </div>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                    <button class="upload-btn" onclick="resetApp()" style="background: #666;">
                        Upload New Image
                    </button>
                </div>
            </div>

            <div class="info-panel">
                <h3>📝 Drawing Instructions</h3>
                <p id="stepInstructions">Loading instructions...</p>
            </div>
        </div>
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    
    <!-- OpenCV.js for layered image processing -->
    <!-- Official OpenCV.js from OpenCV repository -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    
    <script src="app.js"></script>
</body>
</html>
